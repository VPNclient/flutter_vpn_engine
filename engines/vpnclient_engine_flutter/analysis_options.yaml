include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Archived old public API (flows/sdd-flutter-vpnclient-engine/) — kept on
    # disk/in git per the "moving, not deleting" policy, but frozen: not
    # rewritten to satisfy current lint style, and internally self-consistent
    # rather than fixed against every naming convention.
    - lib/src/legacy_v2/**
    # Pre-existing tests for that old API — same reasoning as above; adapting
    # 1188 lines of tests to the archived code's exact shape is disproportionate
    # effort for code that's explicitly no longer maintained going forward.
    - test/legacy_v2/**
    # Demo app still written against the old (now-archived) public API —
    # stale, unmaintained, matches the accepted compatibility-break risk in
    # 01-requirements.md's Resolved Decision 3 (full API replacement).
    - example/**
